name: Release APK

# Push a tag like v1.0.0 to build a signed release APK and attach it to a GitHub Release.
# Required repository secrets:
#   RELEASE_KEYSTORE_BASE64  base64 of your .jks file
#   RELEASE_STORE_PASSWORD   keystore password
#   RELEASE_KEY_ALIAS        key alias (e.g. kallaapetti)
#   RELEASE_KEY_PASSWORD     key password
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Add the RELEASE_* repository secrets (see the comment at the top of this file) before tagging a release." >&2
            exit 1
          fi

      - name: Tests
        run: ./gradlew testDebugUnitTest :core:model:test

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "ModernKallaaPetti-${GITHUB_REF_NAME}.apk" aligned.apk
          rm release.jks aligned.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ModernKallaaPetti-*.apk
